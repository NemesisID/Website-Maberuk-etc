name: Supabase Auto Backup Database

on:
  schedule:
    # Run every Sunday at 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual trigger via GitHub Actions UI

jobs:
  backup:
    name: Backup Supabase PostgreSQL Database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Generate Backup Name and Timestamp
        id: vars
        run: |
          echo "TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_OUTPUT
          mkdir -p backups

      - name: Run pg_dump Backup
        env:
          DB_URL: ${{ secrets.DATABASE_URL || secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::DATABASE_URL secret is missing in GitHub Repository Secrets!"
            exit 1
          fi
          echo "Memulai backup database Supabase..."
          pg_dump "$DB_URL" --no-owner --no-privileges --clean --if-exists | gzip > "backups/supabase_backup_${{ steps.vars.outputs.TIMESTAMP }}.sql.gz"
          echo "Backup selesai. Ukuran file:"
          ls -lh backups/

      - name: Upload Backup as GitHub Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ steps.vars.outputs.TIMESTAMP }}
          path: backups/*.sql.gz
          retention-days: 60
